[project]
name = "stave-infer"
version = "0.1.0"
description = "STAVE learned-advice inference runtime for B, F and S model bundles"
license = "Apache-2.0"
requires-python = ">=3.14,<3.15"
# Stay on Transformers 4.x: load_tokenizer requires the slow RobertaTokenizer.
# In 5.x, RobertaTokenizer uses a fast backend that the runtime rejects.
dependencies = [
  "torch==2.13.0",
  "transformers==4.57.6",
  "tokenizers==0.22.2",
]

[dependency-groups]
dev = [
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "ruff>=0.15.19",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

# Use PyTorch's CPU index on Linux to avoid CUDA dependencies.
# PyPI already supplies non-CUDA wheels for macOS and Windows.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.hatch.build.targets.wheel]
packages = ["src/stave_infer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
extend-select = ["UP006", "UP035"]

[tool.pyright]
include = ["src/stave_infer", "tests"]
extraPaths = ["tests", "../tools"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
